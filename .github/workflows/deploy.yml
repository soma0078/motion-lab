name: Deploy to Netlify

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - motion-vocabulary.md
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Deploy to production
        run: npx --yes netlify-cli@27 deploy --prod --no-build --dir=dist --functions=netlify/functions --message "GitHub Actions ${GITHUB_SHA::7}"
